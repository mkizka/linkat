name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --coverage
  e2e-test:
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-test
      cancel-in-progress: false
      queue: max
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: pnpm playwright install --with-deps
      - run: cp .env.example .env
      - run: pnpm setup-dev
      - run: pnpm build
      - run: pnpm e2e
        env:
          E2E_HANDLE: ${{ secrets.E2E_HANDLE }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - name: Upload Report
        if: always() && (github.ref == 'refs/heads/main' || github.actor == 'mkizka')
        run: |
          E2E_S3_PATH="playwright-report/${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}"
          aws s3 cp playwright-report "s3://$E2E_S3_PATH" --recursive
          echo "E2E_REPORT_URL=${{ vars.S3_BASE_URL }}/$E2E_S3_PATH/index.html" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
      - name: Comment on PR
        if: always() && github.ref != 'refs/heads/main' && github.actor == 'mkizka'
        run: |
          MARKER="<!-- e2e-test-report -->"
          BODY="$MARKER
          ## E2E Test Report
          📊 [View Report]($E2E_REPORT_URL)"
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][-1].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment ${{ github.event.number }} --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
