name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          npm i -g corepack@latest
          corepack enable pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i
      - run: npm i -g @railway/cli
      - name: Plan
        run: railway config plan --out railway-plan.json | tee plan-output.txt
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-plan
          path: railway-plan.json
      - name: Comment plan on PR
        if: always()
        run: |
          MARKER="<!-- railway-config-plan -->"
          {
            echo "$MARKER"
            echo "## Railway config plan"
            echo '```'
            cat plan-output.txt
            echo '```'
          } > comment.md
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq "[.[] | select(.body | startswith(\"$MARKER\"))][-1].id // empty")
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body=@comment.md
          else
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - run: npm i -g @railway/cli
      - name: Download pinned plan
        run: |
          RUN_ID=$(gh run list --workflow=railway-config.yml --json databaseId,headSha,conclusion \
            --jq "[.[] | select(.headSha == \"${{ github.event.pull_request.head.sha }}\" and .conclusion == \"success\")][0].databaseId")
          gh run download "$RUN_ID" -n railway-plan
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Apply
        run: railway config apply --plan railway-plan.json --yes --confirm-destructive
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
